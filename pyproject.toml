[project]
name = "aws-security-assurance-toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lbhatti-risk", email = "42j5bdhg44@privaterelay.appleid.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "boto3>=1.43.2",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
assurance = "aws_security_assurance_toolkit.main:app"
aws-audit = "aws_security_assurance_toolkit.main:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
